<span style="font-size: 14px; font-weight: 600; padding: 0 8px">Tipo</span>
<sc-for list="{{tipos}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 40px; padding: 0 14px; border: none; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}; font-weight: {{t.fw}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-labelledby="t-reco" style="flex: 3 1 560px; min-width: 0; background: var(--nl-card); border: 1px solid var(--nl-border); border-radius: 12px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<h2 id="t-reco" style="margin: 0; font-size: 18px; font-weight: 600">Ubicaciones recomendadas para {{potTxt}} · {{tipoTxt}}</h2>
<p style="margin: 0; font-size: 14px; color: var(--nl-muted)">{{tipoNota}} Selecciona un centro para simular la conexión.</p>
<sc-for list="{{cands}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 10px; border: 2px solid {{c.border}}; background: {{c.bg}}; font: inherit; color: var(--nl-ink); cursor: pointer">
<span style="width: 14px; height: 14px; border-radius: 50%; background: {{c.col}}; flex: none"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{c.id}} · {{c.barrio}}</span>
<span style="font-size: 13px; color: var(--nl-muted)">Margen libre: {{c.margen}} kVA</span>
</span>
<span style="flex: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{c.tagBg}}; color: {{c.tagFg}}">{{c.tag}}</span>
</button>
</sc-for>
<p style="margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--nl-soft); font-size: 13px; line-height: 1.5; color: var(--nl-ink)">Información pública y no vinculante para operadores y ayuntamientos. Norte Luz no instala ni explota puntos de recarga ni da trato preferente: publica la capacidad y responde antes donde no hace falta reforzar.</p>
</section>

<section aria-labelledby="t-sim" style="flex: 1 1 320px; min-width: 0; background: var(--nl-card); border: 2px solid {{simCol}}; border-radius: 12px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<h2 id="t-sim" style="margin: 0; font-size: 18px; font-weight: 600">Simulador: ¿y si se conecta?</h2>
<p style="margin: 0; font-size: 15px">{{potTxt}} en <strong>{{selId}}</strong> ({{selBarrio}})</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--nl-muted)"><span>Carga en punta, antes</span><span style="font-family: 'IBM Plex Mono', monospace">{{antes}} %</span></div>
<div style="position: relative; height: 16px; border-radius: 8px; background: var(--nl-soft)">
<div style="width: {{antesW}}%; height: 100%; border-radius: 8px; background: {{antesCol}}"></div>
<div style="position: absolute; left: 83.3%; top: -4px; bottom: -4px; border-left: 2px dashed var(--nl-ink)"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--nl-muted)"><span>Carga en punta, después</span><span style="font-family: 'IBM Plex Mono', monospace">{{despues}} %</span></div>
<div style="position: relative; height: 16px; border-radius: 8px; background: var(--nl-soft)">
<div style="width: {{despuesW}}%; height: 100%; border-radius: 8px; background: {{simCol}}"></div>
<div style="position: absolute; left: 83.3%; top: -4px; bottom: -4px; border-left: 2px dashed var(--nl-ink)"></div>
</div>
<span style="font-size: 12px; color: var(--nl-muted)">Línea discontinua: 100 % de la potencia del centro</span>
</div>
<div style="padding: 14px; border-radius: 10px; background: {{simBg}}; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 18px; font-weight: 700; color: {{simFg}}">{{simTit}}</span>
<span style="font-size: 14px; line-height: 1.5; color: {{simFg}}">{{simTxt}}</span>
</div>
<a href="Optimizador.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; border: 2px solid var(--nl-brand-line); color: var(--nl-brand-txt); font-weight: 600; text-decoration: none">Ver opciones en el optimizador</a>
</section>
</div>
</main>
</div>
</script>
<script>

class Component extends DCLogic {
  state = { pot: 150, tipo: 'publico', sel: 'CT-0506' };

  _temaAplicar(t, guardar) {
    if (t !== 'dark' && t !== 'light') return;
    this._tema = t;
    if (typeof document !== 'undefined') document.documentElement.setAttribute('data-nl-tema', t);
    if (guardar) { try { localStorage.setItem('nl-tema', t); } catch (e) {} }
    this.setState({ _tema: t });
  }

  _temaEmitir(msg) {
    if (typeof window === 'undefined') return;
    const visit = (w, depth) => {
      try { if (w !== window) w.postMessage(msg, '*'); } catch (e) {}
      if (depth > 4) return;
      let n = 0;
      try { n = w.frames.length; } catch (e) { n = 0; }
      for (let i = 0; i < n; i++) { try { visit(w.frames[i], depth + 1); } catch (e) {} }
    };
    try { visit(window.top, 0); } catch (e) {}
  }

  _temaInit() {
    if (this._ti) return;
    this._ti = true;
    let t = null;
    try { t = localStorage.getItem('nl-tema'); } catch (e) {}
    this._elegido = !!t;
    try { if (!t && typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; } catch (e) {}
    this._tema = t || 'light';
    if (typeof document !== 'undefined') document.documentElement.setAttribute('data-nl-tema', this._tema);
    if (typeof window === 'undefined' || !window.addEventListener) return;
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.nlTema && d.nlTema !== this._tema) { this._elegido = true; this._temaAplicar(d.nlTema, true); }
      if (d.nlTemaPedir && this._elegido && e.source) { try { e.source.postMessage({ nlTema: this._tema }, '*'); } catch (err) {} }
    });
    window.addEventListener('storage', (e) => { if (e.key === 'nl-tema' && e.newValue && e.newValue !== this._tema) this._temaAplicar(e.newValue, false); });
    setTimeout(() => this._temaEmitir({ nlTemaPedir: true }), 300);
  }

  renderVals() {
    this._temaInit();
    const oscuro = this._tema === 'dark';
    return Object.assign(this._rv(), {
      temaTxt: oscuro ? '☀ Modo claro' : '☾ Modo oscuro', temaOn: oscuro ? 'true' : 'false',
      toggleTema: () => {
        const t = oscuro ? 'light' : 'dark';
        this._elegido = true;
        this._temaAplicar(t, true);
        this._temaEmitir({ nlTema: t });
      }
    });
  }

  _rv() {
    const pot = this.state.pot;
    const tipo = this.state.tipo;
    const base = [
      { id: 'CT-0506', barrio: 'Polígono Norte', cap: 630, punta: 420, noche: 260 },
      { id: 'CT-0471', barrio: 'La Ribera', cap: 400, punta: 240, noche: 150 },
      { id: 'CT-0489', barrio: 'Puerto', cap: 400, punta: 280, noche: 170 },
      { id: 'CT-0446', barrio: 'Universidad', cap: 400, punta: 325, noche: 190 },
      { id: 'CT-0417', barrio: 'Centro', cap: 400, punta: 372, noche: 210 }
    ];
    const flota = tipo === 'flota';
    const rows = base.map((b) => {
      const usado = flota ? b.noche : b.punta;
      const margen = b.cap - usado;
      const u1 = usado / b.cap;
      const u2 = (usado + pot) / b.cap;
      return Object.assign({}, b, { margen, u1, u2 });
    }).sort((a, b) => b.margen - a.margen);
    const tag = (r) => (r.u2 < 0.9 ? ['Cabe sin refuerzo', 'var(--nl-ok-bg)', 'var(--nl-ok-fg)'] : (r.u2 < 1 ? ['Cabe con gestión', 'var(--nl-warn-bg)', 'var(--nl-warn-fg)'] : ['Requiere estudio', 'var(--nl-bad-bg)', 'var(--nl-bad-fg)']));
    const colOf = (u) => (u >= 0.9 ? '#B42318' : (u >= 0.7 ? '#E0A112' : '#2F8F46'));
    const sel = rows.find((r) => r.id === this.state.sel) || rows[0];
    const cands = rows.map((r) => {
      const t = tag(r);
      const on = r.id === sel.id;
      return {
        id: r.id, barrio: r.barrio, margen: r.margen, col: colOf(r.u1),
        tag: t[0], tagBg: t[1], tagFg: t[2],
        pressed: on ? 'true' : 'false',
        border: on ? 'var(--nl-brand-line)' : 'var(--nl-border)',
        bg: on ? 'var(--nl-blue-soft)' : 'var(--nl-card)',
        pick: () => this.setState({ sel: r.id })
      };
    });
    const st = sel.u2 >= 1 ? ['Supera la potencia del centro', 'Haría falta gestionar la carga o reforzar antes de conectar.', '#B42318', 'var(--nl-bad-bg)', 'var(--nl-bad-fg)']
      : (sel.u2 >= 0.9 ? ['Queda saturado', 'Se puede conectar con conexión gestionada o desplazando carga.', '#E0A112', 'var(--nl-warn-bg)', 'var(--nl-warn-fg)']
      : ['Se puede conectar', 'Hay margen: respuesta rápida, sin refuerzo.', '#2F8F46', 'var(--nl-ok-bg)', 'var(--nl-ok-fg)']);
    const mk = (opts) => opts.map(([k, l]) => ({ k, l }));
    const seg = (cur, list, key) => list.map((o) => ({
      label: o.l,
      pressed: cur === o.k ? 'true' : 'false',
      bg: cur === o.k ? 'var(--nl-primary)' : 'transparent',
      fg: cur === o.k ? '#FFFFFF' : 'var(--nl-ink)',
      fw: cur === o.k ? '600' : '400',
      pick: () => this.setState({ [key]: o.k })
    }));
    const potTxt = String(pot).replace('.', ',') + ' kW';
    return {
      pots: seg(pot, mk([[7.4, '7,4 kW'], [22, '22 kW'], [50, '50 kW'], [150, '150 kW']]), 'pot'),
      tipos: seg(tipo, mk([['publico', 'Punto público'], ['flota', 'Depósito de flota']]), 'tipo'),
      potTxt,
      tipoTxt: flota ? 'depósito de flota' : 'punto público',
      tipoNota: flota ? 'La flota carga de noche, cuando los centros tienen más margen.' : 'Recarga en horario de punta, con la potencia completa.',
      cands,
      selId: sel.id, selBarrio: sel.barrio,
      antes: Math.round(sel.u1 * 100), antesW: Math.min(100, sel.u1 / 1.2 * 100).toFixed(1), antesCol: colOf(sel.u1),
      despues: Math.round(sel.u2 * 100), despuesW: Math.min(100, sel.u2 / 1.2 * 100).toFixed(1),
      simTit: st[0], simTxt: st[1], simCol: st[2], simBg: st[3], simFg: st[4]
    };
  }
}

;window.__dcBoot(Component);
</script>
</body>
</html>
