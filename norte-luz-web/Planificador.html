</div>
</section>

<sc-if value="{{cargando}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 30px; text-align: center; font-size: 15px; color: var(--nl-muted)">Cargando el mapa de España…</p>
</sc-if>

<div style="display: flex; flex-wrap: wrap; gap: 20px">

</div>

<div style="flex: 1 1 90px; padding: 8px 10px; border-radius: 8px; background: var(--nl-bg)"><div style="font-size: 12px; color: var(--nl-muted)">Uso medio en punta</div><div style="font-size: 20px; font-weight: 700; font-family: 'IBM Plex Mono', monospace">{{m.uso}}</div></div>
<div style="flex: 1 1 120px; padding: 8px 10px; border-radius: 8px; background: var(--nl-bg)"><div style="font-size: 12px; color: var(--nl-muted)">{{m.invLabel}}</div><div style="font-size: 20px; font-weight: 700; font-family: 'IBM Plex Mono', monospace">{{m.inv}}</div></div>

</section>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-size: 13px">
<span style="font-weight: 600">Uso de la capacidad en hora punta</span>
<span style="display: flex; align-items: center; gap: 8px"><span>50 %</span><span style="width: 240px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #2F8F46 0%, #7DB24A 33%, #E0A112 50%, #E0691F 66%, #B42318 83%, #6E0F0A 100%)"></span><span>&gt;110 %</span></span>
<span><b style="color: var(--nl-ok-fg)">Verde &lt;70 %</b>: caben cargadores · <b style="color: var(--nl-warn-fg)">Ámbar 70-90 %</b>: vigilar · <b style="color: var(--nl-bad-txt)">Rojo &gt;90 %</b>: saturado</span>
<sc-if value="{{verSubs}}" hint-placeholder-val="{{ false }}"><span>Puntos: subestaciones i-DE hoy (rojo = 0 MW libres, verde = con capacidad)</span></sc-if>
</div>

<section aria-labelledby="t-pniec" style="background: var(--nl-card); border: 2px solid var(--nl-brand-line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 id="t-pniec" style="margin: 0; font-size: 18px; font-weight: 700">Objetivo PNIEC frente a la realidad: 5,5 millones de vehículos eléctricos en 2030</h2>
<button type="button" onClick="{{verPniec}}" aria-pressed="{{esPniec}}" style="min-height: 40px; padding: 0 14px; border: none; border-radius: 8px; background: var(--nl-primary); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Ver la red si se cumple el PNIEC (2030)</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px">
<div style="padding: 12px; border-radius: 10px; background: var(--nl-bg); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: var(--nl-muted)">Vehículos eléctricos en 2030 en el escenario elegido</span>
<span style="font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace">{{gapEv30}} <span style="font-size: 14px; color: var(--nl-muted)">de 5,5 M</span></span>
<div style="height: 10px; border-radius: 5px; background: var(--nl-soft)"><div style="height: 100%; width: {{gapPct}}%; border-radius: 5px; background: var(--nl-primary)"></div></div>
<span style="font-size: 12px; color: var(--nl-muted)">{{gapTxt}}</span>
</div>
<div style="padding: 12px; border-radius: 10px; background: var(--nl-bg); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: var(--nl-muted)">Lo que había en la calle</span>
<span style="font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace">184.000</span>
<span style="font-size: 12px; color: var(--nl-muted)">vehículos eléctricos matriculados entre 2018 y 2022 (4,3 % de las ventas en 2022). Índice de electromovilidad: 14,7 en España frente a 28,2 en la UE.</span>
</div>
<div style="padding: 12px; border-radius: 10px; background: var(--nl-bg); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: var(--nl-muted)">Puntos de recarga públicos (primavera de 2024)</span>
<span style="font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace">32.422 <span style="font-size: 14px; color: var(--nl-muted)">de 64.000</span></span>
<div style="height: 10px; border-radius: 5px; background: var(--nl-soft)"><div style="height: 100%; width: 50.7%; border-radius: 5px; background: #E0A112"></div></div>
<span style="font-size: 12px; color: var(--nl-muted)">La mitad del objetivo para finales de 2024.</span>
</div>
<div style="padding: 12px; border-radius: 10px; background: var(--nl-bad-bg); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: var(--nl-bad-fg)">Si se cumple el PNIEC y la red no se prepara</span>
<span style="font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: var(--nl-bad-fg)">{{pnRojas}}</span>
<span style="font-size: 12px; color: var(--nl-bad-fg)">provincias en rojo en 2030 (faltan {{pnFalta}} de capacidad); {{pnRojas35}} en 2035. Con las acciones, ninguna.</span>
</div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--nl-muted)">La lectura para Norte Luz: el objetivo de vehículos eléctricos va muy por delante de lo que hay en la calle, y la red de distribución tiene que estar lista antes de que llegue la demanda, no después. El PNIEC 2023-2030 prevé 214 GW de potencia instalada en 2030 (81 % de electricidad renovable, 19 GW de autoconsumo y 18,5 GW de almacenamiento), pero esa energía tiene que llegar a los garajes a través de los centros de transformación.</p>
<p style="margin: 0; font-size: 12px; color: var(--nl-muted)">Fuente: Observatorio de la Formación Profesional en España, Informe 2024 (CaixaBank Dualiza y Orkestra), a partir de PNIEC 2023-2030, DGT y ANFAC. Provincias en rojo: modelo ilustrativo del prototipo.</p>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="t-sel" style="flex: 1 1 360px; min-width: 0; background: var(--nl-card); border: 1px solid var(--nl-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: var(--nl-muted)">Provincia seleccionada · haz clic en el mapa</span>
<h2 id="t-sel" style="margin: 0; font-size: 22px; font-weight: 700">{{sel.n}}</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<div style="flex: 1 1 120px; padding: 10px; border-radius: 8px; background: {{sel.bgSin}}"><div style="font-size: 12px; color: var(--nl-muted)">Si seguimos como hoy</div><div style="font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: {{sel.colSin}}">{{sel.uSin}}</div></div>
<div style="flex: 1 1 120px; padding: 10px; border-radius: 8px; background: {{sel.bgCon}}"><div style="font-size: 12px; color: var(--nl-muted)">Con acciones</div><div style="font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: {{sel.colCon}}">{{sel.uCon}}</div></div>
</div>

<rect x="36" y="10" width="354" height="140" style="fill: var(--nl-panel)"></rect>

<line x1="36" x2="390" y1="{{sel.y70}}" y2="{{sel.y70}}" style="stroke: #E0A112; stroke-dasharray: 4 4"></line>

<text x="213" y="168" text-anchor="middle" style="font-size: 11px; fill: var(--nl-muted)">2038</text>
<text x="390" y="168" text-anchor="end" style="font-size: 11px; fill: var(--nl-muted)">2050</text>
</svg>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 3px; background: #B42318"></span>Sin actuar</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 3px; background: #2F8F46"></span>Con acciones</span></div>
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<tbody>
<sc-for list="{{sel.filas}}" as="f" hint-placeholder-count="5">
<tr style="border-top: 1px solid var(--nl-border)"><td style="padding: 7px 0; color: var(--nl-muted)">{{f.k}}</td><td style="padding: 7px 0; text-align: right; font-weight: 600">{{f.v}}</td></tr>
</sc-for>
</tbody>
</table>
</section>

<section aria-labelledby="t-inv" style="flex: 1 1 360px; min-width: 0; background: var(--nl-card); border: 2px solid #E0A112; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<h2 id="t-inv" style="margin: 0; font-size: 18px; font-weight: 700">Alerta: coches invisibles</h2>
<span style="padding: 3px 8px; border-radius: 999px; background: var(--nl-warn-bg); color: var(--nl-warn-fg); font-size: 12px; font-weight: 600">Detección con contadores</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--nl-muted)">Puntos de recarga de 3,7 a 7,4 kW instalados en garajes sin comunicarlo a la distribuidora. No aparecen en las solicitudes de conexión, pero los contadores inteligentes ven su huella: consumo nocturno nuevo de 2 a 7 kW durante horas.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<div style="flex: 1 1 120px; padding: 10px; border-radius: 8px; background: var(--nl-warn-bg)"><div style="font-size: 12px; color: var(--nl-warn-fg)">Coches invisibles estimados en {{ano}}</div><div style="font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: var(--nl-warn-fg)">{{invTotal}}</div></div>
<div style="flex: 1 1 120px; padding: 10px; border-radius: 8px; background: var(--nl-bad-bg)"><div style="font-size: 12px; color: var(--nl-bad-fg)">Provincias que cambian de color</div><div style="font-size: 22px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: var(--nl-bad-fg)">{{invCambian}}</div></div>
</div>
<span style="font-size: 14px; font-weight: 600">Donde el semáforo real es peor que el teórico</span>
<sc-for list="{{invLista}}" as="v" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--nl-border)"><span>{{v.n}}</span><span style="font-family: 'IBM Plex Mono', monospace"><span style="color: {{v.c1}}">{{v.teo}}</span> → <span style="color: {{v.c2}}; font-weight: 700">{{v.real}}</span></span></div>
</sc-for>
<sc-if value="{{invVacia}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: var(--nl-muted)">En este año los coches invisibles aún no cambian el color de ninguna provincia.</span></sc-if>
<span style="font-size: 12px; color: var(--nl-muted)">Supuesto: entre el 12 y el 26 % de la recarga doméstica no se comunica (más en zonas con garajes comunitarios).</span>
</section>
</div>

<section aria-labelledby="t-rank" style="background: var(--nl-card); border: 1px solid var(--nl-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 id="t-rank" style="margin: 0; font-size: 18px; font-weight: 700">Ranking de inversión · horizonte 2050</h2>
<span style="font-size: 14px; color: var(--nl-muted)">Total España: <b style="color: var(--nl-bad-txt)">{{totSin}}</b> sin actuar · <b style="color: var(--nl-ok-fg)">{{totCon}}</b> con acciones · ahorro <b>{{totAhorro}}</b></span>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px">
<thead><tr style="text-align: left; color: var(--nl-muted)"><th style="padding: 6px 4px; font-weight: 600">#</th><th style="padding: 6px 4px; font-weight: 600">Provincia</th><th style="padding: 6px 4px; font-weight: 600">Llega al rojo sin actuar</th><th style="padding: 6px 4px; font-weight: 600; text-align: right">Inversión sin actuar</th><th style="padding: 6px 4px; font-weight: 600; text-align: right">Con acciones</th><th style="padding: 6px 4px; font-weight: 600; text-align: right">Ahorro</th><th style="padding: 6px 4px; font-weight: 600">Prioridad en {{ano}}</th></tr></thead>
<tbody>
<sc-for list="{{ranking}}" as="r" hint-placeholder-count="10">
<tr onClick="{{r.pick}}" style="border-top: 1px solid var(--nl-border); cursor: pointer; background: {{r.bg}}"><td style="padding: 8px 4px; font-family: 'IBM Plex Mono', monospace">{{r.i}}</td><td style="padding: 8px 4px; font-weight: 600">{{r.n}}</td><td style="padding: 8px 4px">{{r.anoRojo}}</td><td style="padding: 8px 4px; text-align: right; font-family: 'IBM Plex Mono', monospace; color: var(--nl-bad-txt)">{{r.sin}}</td><td style="padding: 8px 4px; text-align: right; font-family: 'IBM Plex Mono', monospace; color: var(--nl-ok-fg)">{{r.con}}</td><td style="padding: 8px 4px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-weight: 700">{{r.ahorro}}</td><td style="padding: 8px 4px"><span style="padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{r.pBg}}; color: {{r.pFg}}">{{r.prio}}</span></td></tr>
</sc-for>
</tbody>
</table>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--nl-muted)">Sin actuar: refuerzos de urgencia cuando la red ya está saturada (0,55 M€ por MW, obra civil y plazos cortos). Con acciones: refuerzos planificados antes de saturar (0,35 M€/MW), nuevos centros, gestión de la recarga y flexibilidad. Ordenado por la inversión que haría falta sin actuar; la prioridad depende del año en que se satura. Haz clic en una fila para verla en el mapa.</p>
</section>

<section style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-radius: 12px; background: var(--nl-primary); color: #FFFFFF">
<p style="margin: 0; flex: 1 1 420px; font-size: 15px; line-height: 1.5">El mapa nacional dice dónde y cuándo; las pantallas siguientes bajan al barrio: qué centro se satura, dónde poner un centro nuevo y qué hacer antes de reforzar.</p>
<a href="NuevoCentro.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 10px; background: #F2BC2B; color: #0E3F73; font-weight: 600; text-decoration: none">Bajar a un barrio real (Bilbao)</a>
</section>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--nl-muted)">Fuentes: límites provinciales (es-atlas, IGN); población aproximada por provincia (INE); subestaciones y nudos sin capacidad firme: i-DE R1-001, 02/10/2026. Proyección ilustrativa: electrolineras de 1 MW con simultaneidad del 50 %, más concentradas en zonas densas; curva de adopción del vehículo eléctrico hasta 2050 (unos 5 millones en 2035 en el escenario central), 0,53 turismos por habitante, recarga de 7,4 kW y uso de partida estimado según la densidad de población. No es un cálculo de ingeniería.</p>
</main>
</div>

    const X = (j) => (36 + j * 354 / 24).toFixed(1);
    const Y = (u) => (150 - Math.max(0, Math.min(1.4, u - 0.4)) / 1.0 * 140).toFixed(1);
    const anoRojo = (arr) => { const j = arr.findIndex((u) => u >= 0.9); return j < 0 ? 'después de 2050' : String(2026 + j); };
    const sel = {
      n: so.m.n, uSin: pct(so.sinU[i]), uCon: pct(so.conU[i]), colSin: txt(so.sinU[i]), colCon: txt(so.conU[i]), bgSin: bg(so.sinU[i]), bgCon: bg(so.conU[i]),
      y90: Y(0.9), y70: Y(0.7), y90t: (+Y(0.9) + 4).toFixed(1), y70t: (+Y(0.7) + 4).toFixed(1), xAno: X(i),
      ptsSin: so.sinU.map((u, j) => X(j) + ',' + Y(u)).join(' '), ptsCon: so.conU.map((u, j) => X(j) + ',' + Y(u)).join(' '),
      filas: [
        { k: 'Población', v: fmt(so.m.pop * 1000) + ' hab.' },
        { k: 'Vehículos eléctricos en ' + st.ano, v: fmt(so.m.pop * 1000 * 0.53 * this.share(st.ano)) },
        { k: 'Se pone en rojo sin actuar', v: anoRojo(so.sinU) },
        { k: 'Se pone en rojo con acciones', v: anoRojo(so.conU) },
        { k: 'Nudos i-DE sin capacidad firme hoy (real)', v: so.m.z == null ? 'fuera de i-DE' : pct(so.m.z) + ' de ' + so.m.nodos }
      ]
    };
    // invisible cars
    let invTotal = 0;
    const camb = [];
    ids.forEach((id) => {
      const o = mod[id];
      invTotal += o.invCars[i];
      const t = o.teoU[i], r = o.sinU[i];
      const cls = (u) => (u >= 0.9 ? 2 : (u >= 0.7 ? 1 : 0));
      if (st.ami && cls(r) > cls(t)) camb.push({ n: o.m.n, teo: pct(t), real: pct(r), c1: txt(t), c2: txt(r), d: r - t, pop: o.m.pop });
    });
    camb.sort((a, b) => b.pop - a.pop);
    // ranking
    const rank = ids.map((id) => {
      const o = mod[id];
      const sin = urgente(o, 24), con = o.costeCon[24] + urgCon(o, 24);
      const j = o.sinU.findIndex((u) => u >= 0.9);
      return { o, sin, con, ahorro: sin - con, j: j < 0 ? 99 : j };
    }).sort((a, b) => b.sin - a.sin).slice(0, 10);
    const prio = (j) => (j <= i ? ['Urgente', 'var(--nl-bad-bg)', 'var(--nl-bad-fg)'] : (j <= i + 5 ? ['Planificar ya', 'var(--nl-warn-bg)', 'var(--nl-warn-fg)'] : ['Vigilar', 'var(--nl-blue-soft)', 'var(--nl-brand-txt)']));
    const accDef = [
      ['gestion', 'Gestión de la recarga', 'Señales horarias y recarga inteligente: al menos el 85 % en valle'],
      ['redirigir', 'Cargadores a zonas verdes', 'Orientar nuevas conexiones y electrolineras a centros con margen (−10 % de pico; −30 % del impacto de las electrolineras)'],
      ['flex', 'Flexibilidad y baterías', 'Contratar flexibilidad local y almacenamiento antes de reforzar (−5 puntos)'],
      ['refuerzo', 'Refuerzos priorizados', 'Reforzar con 4 años de antelación donde la previsión supera el 85 %'],
      ['centros', 'Nuevos centros', 'Nuevos centros de transformación en zonas densas (+0,8 % de capacidad al año)']
    ];
    const valleTxt = st.valle >= 75 ? 'casi todo de noche' : (st.valle >= 45 ? 'mixto' : 'sobre todo al llegar a casa (punta)');
    const veTxt = ['muy lento', 'lento', 'tendencial', 'rápido', 'muy rápido', 'objetivo PNIEC'][st.ve - 1];
    return {
      cargando: loading,
      ano: st.ano,
      playIcon: st.playing ? '❚❚' : '▶', playLabel: st.playing ? 'Pausar' : 'Reproducir de 2026 a 2050',
      play: () => {
        if (this._timer) { clearInterval(this._timer); this._timer = null; this.setState({ playing: false }); return; }
        if (this.state.ano >= 2050) this.setState({ ano: 2026 });
        this.setState({ playing: true });
        this._timer = setInterval(() => {
          if (this.state.ano >= 2050) { clearInterval(this._timer); this._timer = null; this.setState({ playing: false }); return; }
          this.setState({ ano: this.state.ano + 1 });
        }, 700);
      },
      setAno: (e) => this.setState({ ano: +e.target.value }),
      sliders: [
        { label: 'Aumento de vehículos eléctricos', valor: veTxt, min: 1, max: 6, step: 1, v: st.ve, lo: 'muy lento', hi: 'objetivo PNIEC', nota: fmt(evN, 1) + ' millones de VE en España en ' + st.ano + ' · objetivo PNIEC: 5,5 M en 2030', set: (e) => this.setState({ ve: +e.target.value }) },
        { label: 'Horario de carga', valor: st.valle + ' % en valle', min: 10, max: 90, step: 5, v: st.valle, lo: 'al llegar a casa (punta)', hi: 'de madrugada (valle)', nota: 'Recarga ' + valleTxt + ': ' + fmt(this.kwPunta(st.valle), 1) + ' kW por coche en la hora punta', set: (e) => this.setState({ valle: +e.target.value }) },
        { label: 'Electrolineras de recarga rápida', valor: st.hubs + ' por 100.000 hab.', min: 0, max: 20, step: 1, v: st.hubs, lo: 'ninguna', hi: '20', nota: '≈' + fmt(st.hubs * 470 * this.share(st.ano) / this.share(2035)) + ' hubs de 1 MW en España en ' + st.ano + ', sobre todo en ciudades', set: (e) => this.setState({ hubs: +e.target.value }) },
        { label: 'Crecimiento del resto de la demanda', valor: fmt(st.dem, 2) + ' %/año', min: 0, max: 3, step: 0.25, v: st.dem, lo: '0 %', hi: '3 %', nota: 'Bombas de calor, nuevas viviendas, actividad económica', set: (e) => this.setState({ dem: +e.target.value }) }
      ],
      acciones: accDef.map(([k, l, tip]) => ({ label: l, tip, on: st.acc[k] ? 'true' : 'false', mark: st.acc[k] ? '✓' : '+', bg: st.acc[k] ? 'var(--nl-primary)' : 'var(--nl-card)', fg: st.acc[k] ? '#FFFFFF' : 'var(--nl-brand-txt)', toggle: () => this.setState({ acc: Object.assign({}, this.state.acc, { [k]: !this.state.acc[k] }) }) })),
      ami: st.ami, toggleAmi: () => this.setState({ ami: !st.ami }),
      verSubs: st.verSubs, toggleSubs: () => this.setState({ verSubs: !st.verSubs }),
      mapas: [
        { id: 'heat-sin', titulo: 'Si seguimos como hoy', sub: 'Sin inversión anticipada ni gestión', borde: '#B42318', rojas: rojSin + ' de 52', uso: pct(sSin / pw), invLabel: 'Capacidad que falta', inv: fmt(falta) + ' MW', aria: 'Mapa de calor de España en ' + st.ano + ' sin actuar', click: (e) => this.clickMapa(e) },
        { id: 'heat-con', titulo: 'Con las acciones necesarias', sub: Object.keys(st.acc).filter((k) => st.acc[k]).length + ' de 5 acciones activas', borde: '#2F8F46', rojas: rojCon + ' de 52', uso: pct(sCon / pw), invLabel: 'Inversión planificada hasta ' + st.ano, inv: eur(invCon), aria: 'Mapa de calor de España en ' + st.ano + ' con acciones', click: (e) => this.clickMapa(e) }
      ],
      sel,
      invTotal: fmt(invTotal), invCambian: st.ami ? String(camb.length) : '—',
      invLista: camb.slice(0, 6), invVacia: st.ami && camb.length === 0,
      ranking: rank.map((r, k) => { const p = prio(r.j); return { i: k + 1, n: r.o.m.n, anoRojo: r.j === 99 ? 'después de 2050' : String(2026 + r.j), sin: eur(r.sin), con: eur(r.con), ahorro: eur(Math.max(0, r.ahorro)), prio: p[0], pBg: p[1], pFg: p[2], bg: r.o.m.id === st.sel ? 'var(--nl-blue-soft)' : 'transparent', pick: () => this.setState({ sel: r.o.m.id }) }; }),
      gapEv30: fmt(ev30, 1) + ' M', gapPct: Math.min(100, ev30 / 5.5 * 100).toFixed(0), gapTxt: ev30 >= 5.45 ? 'Este escenario cumple el objetivo del PNIEC.' : 'Este escenario se queda en el ' + Math.round(ev30 / 5.5 * 100) + ' % del objetivo del PNIEC para 2030.',
      pnRojas: pn.rojSin + ' de 52', pnFalta: fmt(pn.falta) + ' MW', pnRojas35: pn.rojSin35 + ' de 52',
      verPniec: () => this.setState({ ve: 6, ano: 2030 }), esPniec: st.ve === 6,
      totSin: eur(sin50), totCon: eur(con50), totAhorro: eur(Math.max(0, sin50 - con50))
    };
  }
}

;window.__dcBoot(Component);
