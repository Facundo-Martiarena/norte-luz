<p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--nl-muted)">Toda la ciudad de Bilbao para probar la herramienta de Norte Luz (2032, escenario medio). Acerca o aleja el mapa, desplázalo y salta entre barrios; arrastra centros nuevos o hubs de recarga y mira cómo cambia la red, o deja que el optimizador busque la mejor ubicación en la zona que estás viendo.</p>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--nl-muted)">
<span style="display: flex; align-items: center; gap: 8px; flex: 1 1 200px"><span style="display: inline-block; width: {{escalaW}}%; min-width: 20px; height: 0; border-top: 3px solid var(--nl-ink)"></span>{{escalaTxt}} · {{nVis}} centros en pantalla · zoom: pellizca, Ctrl/⌘ + rueda o botones + / − · arrastra el fondo para moverte</span>
<span>Callejero © colaboradores de OpenStreetMap (ODbL)</span>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--nl-muted)">Arrastra un centro nuevo desde la barra superior y suéltalo en el mapa (o haz clic en el botón y luego en el mapa); después puedes moverlo arrastrándolo. El círculo es su alcance en baja tensión (200 m): solo puede quitar carga a los centros que caen dentro, y los baja al 65 % para que vuelvan a admitir cargadores. Esa carga la recoge el centro nuevo, que se va llenando y cambia de color con el mismo semáforo: si recoge demasiado, se pone en rojo. Dentro de una manzana se plantea en local de un edificio; sobre la calle, caseta en la vía pública; en parques y plazas, subterráneo. Se supone que la media tensión va por las avenidas principales (línea morada hasta la más cercana). Reales: calles, subestaciones de i-DE y las instalaciones de OpenStreetMap (rombos grises). Simulados: los centros de transformación, sus cargas y los plazos, porque su ubicación y carga no son públicas (OpenStreetMap solo tiene mapeadas 14 instalaciones en Bilbao, casi todas subestaciones).</p>

<p style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--nl-muted)">Se muestran los centros que cambian o, si no hay cambios, los más cargados de la zona visible. «Caben cargadores»: puntos de 7,4 kW que entran hasta el 90 % del centro, contando que cargan a la vez (criterio prudente; con carga gestionada en valle caben más).</p>

<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<section aria-labelledby="t-ami" style="background: var(--nl-card); border: 2px solid #E0A112; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h2 id="t-ami" style="margin: 0; font-size: 18px; font-weight: 600">Alerta: coches invisibles</h2>
<span style="padding: 3px 8px; border-radius: 999px; background: var(--nl-warn-bg); color: var(--nl-warn-fg); font-size: 12px; font-weight: 600">{{amiBadge}}</span>

<details style="font-size: 13px; line-height: 1.5; color: var(--nl-ink)">
<summary style="cursor: pointer; font-weight: 600; min-height: 32px">Cómo decide el plan óptimo (modelo matemático)</summary>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px; color: var(--nl-muted)">
<span>Problema de <b>localización de instalaciones con capacidad</b> (programación lineal entera mixta), resuelto con <b>HiGHS</b> (Universidad de Edimburgo) en el navegador.</span>
<span><b>Decide:</b> qué emplazamientos abrir (y<sub>j</sub> ∈ {0,1}), qué centros saturados reforzar (r<sub>i</sub> ∈ {0,1}) y cuántos kVA pasa cada centro saturado a cada centro nuevo (x<sub>ij</sub> ≥ 0).</span>
<span><b>Minimiza:</b> Σ coste del centro y su cable de media tensión · y<sub>j</sub> + Σ cable de baja tensión · x<sub>ij</sub> + Σ 20.000 € · r<sub>i</sub>.</span>
<span><b>Sujeto a:</b> cada centro en rojo baja al 85 % o menos (por traspaso o por refuerzo, con margen de planificación); nadie cede por debajo del 65 %; solo se traspasa a menos de 200 m; cada centro nuevo se llena como máximo al 85 %; como mucho 6 centros nuevos. Un centro de 1.000 kVA, o al que no le basta el siguiente tamaño, no se puede reforzar.</span>
<span>El modelo reparte el coste del cable de baja tensión en proporción a los kVA traspasados (aproximación lineal); el desglose lo calcula tramo a tramo, por eso puede salir algo más alto que el valor del modelo.</span>
<span>Candidatos: una rejilla de unos 40 × 22 puntos en la zona visible (sin monte ni ría), quedándose con los 3 mejores para cada grupo de centros saturados alcanzables.</span>
</div>
</details>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--nl-muted)">Centro en local o caseta: 20.000 € (reto); subterráneo: unos 43.000 € (CNMC). Cables según valores unitarios CNMC: media tensión 147 €/m y baja tensión 59 €/m. Plazos orientativos.</p>

  wMax() { const b = MAPA.bb; return Math.max(b[2] - b[0], (b[3] - b[1]) * 1400 / 780) * 1.05; }

    const x = Math.max(Math.min(b[0] - 2000, (b[0] + b[2] - w) / 2), Math.min(Math.max(b[2] - w + 2000, (b[0] + b[2] - w) / 2), v.x));

    return { x, y, w };
  }

  zoomEn(f, fx, fy) {
    const v = this.state.view;
    const h = v.w * 780 / 1400;
    const w2 = Math.max(500, Math.min(this.wMax(), v.w * f));
    const h2 = w2 * 780 / 1400;
    const px = v.x + fx * v.w, py = v.y + fy * h;
    this.setState({ view: this.vista({ x: px - fx * w2, y: py - fy * h2, w: w2 }) });
  }

  irA(cx, cy, w) {
    const h = w * 780 / 1400;
    this.setState({ view: this.vista({ x: cx - w / 2, y: cy - h / 2, w }) });
  }

  componentWillUnmount() {

    window.removeEventListener('pointerup', this._up);
    window.removeEventListener('pointercancel', this._up);
  }

  base() {
    const inv = MAPA.inv;
    return MAPA.cts.map((c) => Object.assign({}, c, { teo: c.load, inv: this.state.ami ? (inv[c.id] || 0) : 0, load: c.load + (this.state.ami ? (inv[c.id] || 0) : 0) }));
  }

  celda(x, y) {
    const i = Math.max(0, Math.min(MAPA.cols - 1, Math.floor(x / MAPA.C)));
    const j = Math.max(0, Math.min(Math.floor(MAPA.H / MAPA.C) - 1, Math.floor(y / MAPA.C)));
    return j * MAPA.cols + i;
  }

  zona(x, y) {
    const k = MAPA.zone[this.celda(x, y)];
    if (k === 'x') return { k, nombre: 'zona no construible', coste: 0, plazo: 0, plazoTxt: '—' };
    if (k === 's') return { k, nombre: 'subterráneo en parque o plaza', coste: 43000, plazo: 30, plazoTxt: '24-36 meses' };
    if (k === 'v') return { k, nombre: 'caseta en la vía pública', coste: 20000, plazo: 18, plazoTxt: '12-24 meses' };
    return { k, nombre: 'en local de un edificio', coste: 20000, plazo: 9, plazoTxt: '6-12 meses' };
  }

  mtPunto(x, y) {
    const p = MAPA.mainPts;
    let best = null, bd = Infinity;
    for (let i = 0; i < p.length; i += 2) {
      const d = (p[i] - x) * (p[i] - x) + (p[i + 1] - y) * (p[i + 1] - y);
      if (d < bd) { bd = d; best = [p[i], p[i + 1]]; }
    }
    return { x: best[0], y: best[1], d: Math.sqrt(bd) };
  }

  planActivo(nuevos) {
    const P = this.state.plan;
    return !!(P && P.sites.length === nuevos.length && P.sites.every((q, i) => Math.abs(q.x - nuevos[i].x) < 1 && Math.abs(q.y - nuevos[i].y) < 1));
  }

  simular(nuevos, kva, dev, lim = 1) {
    const P = this.state.plan;
    const SIG = { 250: 400, 400: 630, 630: 1000 };
    const refSet = P ? P.refuerzos : [];
    const cts = this.base().map((c) => {
      const o = Object.assign({}, c, { load2: c.load });
      if (refSet.indexOf(c.id) >= 0 && SIG[c.cap]) { o.capOrig = c.cap; o.cap = SIG[c.cap]; o.ref = true; }
      return o;
    });
    const usaPlan = this.planActivo(nuevos);
    const enlaces = [];
    const carga = [];
    const devLoad = dev ? 160 : 0;
    const H = 180;
    const hubs = this._hubsAct || this.state.hubs || [];
    if (usaPlan) {
      const byId = {};
      cts.forEach((c) => { byId[c.id] = c; });
      nuevos.forEach((n, i) => carga.push(i === 0 ? devLoad : 0));
      P.transfers.forEach((t) => { const c = byId[t.id]; if (!c) return; c.load2 -= t.kva; carga[t.j] += t.kva; enlaces.push({ i: t.j, c, d: Math.hypot(c.x - nuevos[t.j].x, c.y - nuevos[t.j].y) }); });
    } else {
      nuevos.forEach((n, i) => {
        let room = kva * lim - (i === 0 ? devLoad : 0);
        let t = 0;
        cts.map((c) => ({ c, d: Math.hypot(c.x - n.x, c.y - n.y) })).filter((o) => o.d <= 200).sort((a, b) => a.d - b.d).forEach(({ c, d }) => {
          const e = Math.max(0, c.load2 - 0.65 * c.cap);
          const m = Math.min(e, Math.max(0, room));
          if (m > 1) { c.load2 -= m; room -= m; t += m; enlaces.push({ i, c, d }); }
        });
        carga.push(t + (i === 0 ? devLoad : 0));
      });
    }
    // each hub looks for the closest centre that can take it (existing or new), within 400 m
    const hubLinks = [];
    let hubSueltos = 0;
    hubs.forEach((h) => {
      const cand = [];
      cts.forEach((c) => { const d = Math.hypot(c.x - h.x, c.y - h.y); if (d <= 400) cand.push({ c, d, cap: c.cap, load: c.load2 }); });
      nuevos.forEach((n, i) => { const d = Math.hypot(n.x - h.x, n.y - h.y); if (d <= 400) cand.push({ i, n, d, cap: kva, load: carga[i] }); });
      if (!cand.length) { hubSueltos++; hubLinks.push({ h, to: null, d: null, tipo: 'mt' }); return; }
      cand.forEach((o) => {
        o.uA = (o.load + H) / o.cap;
        o.score = o.d + 250 * Math.max(0, o.uA - 0.7) / 0.2 + (o.uA >= 0.9 ? 100000 + 1000 * o.uA : 0);
      });
      cand.sort((a, b) => a.d - b.d);
      const cerca = cand[0];
      let best = cand.slice().sort((a, b) => a.score - b.score)[0];
      if (best.uA >= 0.9) {
        if (cerca.d > 250) { hubSueltos++; hubLinks.push({ h, to: null, d: cerca.d, tipo: 'mt', cerca }); return; }
        best = cerca;
      }
      const tipo = best.uA >= 0.9 ? 'forzado' : (best.uA >= 0.7 ? 'justo' : 'ok');
      const info = { h, d: best.d, tipo, uA: best.uA, cerca: cerca !== best ? cerca : null };
      if (best.c) { best.c.load2 += H; best.c.hub = (best.c.hub || 0) + H; info.to = best.c; }
      else { carga[best.i] += H; info.to = best.n; info.i = best.i; }
      hubLinks.push(info);
    });
    const rojos = cts.filter((c) => c.load2 / c.cap >= 0.9).length + carga.filter((l) => l / kva >= 0.9).length;
    let coste = 0;
    const partidas = [];
    const refuerzos = cts.filter((c) => c.ref).map((c) => ({ id: c.id, de: c.capOrig, a: c.cap }));
    coste += refuerzos.length * 20000;
    nuevos.forEach((n, i) => {
      const z = this.zona(n.x, n.y);
      const mtd = (MAPA.mt.charCodeAt(this.celda(n.x, n.y)) - 48) * 10;
      const mt = mtd * 147;
      const bt = enlaces.filter((e) => e.i === i).reduce((a, e) => a + e.d * 59, 0);
      coste += z.coste + mt + bt;
      partidas.push({ i, z, mt, mtd, bt });
    });
    return { cts, enlaces, carga, rojos, coste, partidas, refuerzos, hubLinks, hubSueltos, hubKva: hubs.length * H };
  }


  // ---------- exact optimisation (MILP, HiGHS) ----------
  // the solver files live in the artifact's own file store (same origin as the page)
  cargarCodigo(url, exportar) {
    return fetch(url).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then((code) => {
      try {
        const v = (new Function(code + '\n;return (' + exportar + ');'))();
        if (v) return v;
      } catch (e) { /* fall back to a script tag */ }
      return new Promise((res, rej) => {
        const sc = document.createElement('script');
        sc.src = url;
        sc.onload = () => { const v = (new Function('return (' + exportar.replace(/\bModule\b/g, 'window.Module') + ');'))(); v ? res(v) : rej(new Error('sin exportación')); };
        sc.onerror = () => rej(new Error('no se pudo ejecutar ' + url));
        document.head.appendChild(sc);
      });
    });
  }

  // HiGHS (WebAssembly), shipped inside the prototype
  cargarHighs() {
    if (this._hp) return this._hp;
    this._hp = Promise.all([
      window.__nlHighsLoader ? Promise.resolve(window.__nlHighsLoader) : this.cargarCodigo('assets/highs.js', "typeof Module !== 'undefined' ? Module : window.Module"),
      window.__nlHighsBytes ? Promise.resolve(null) : fetch('assets/highs-wasm.js').then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    ]).then(([L, txt]) => {
      window.__nlHighsLoader = L;
      if (!window.__nlHighsBytes) {
        const b64 = txt.slice(txt.indexOf('"') + 1, txt.lastIndexOf('"'));
        const bin = atob(b64);
        const u = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        window.__nlHighsBytes = u;
      }
      const arrancar = () => L({ instantiateWasm: (imports, listo) => { WebAssembly.instantiate(window.__nlHighsBytes, imports).then((r) => listo(r.instance, r.module)); return {}; } });
      return { solve: (lp, o) => arrancar().then((h) => h.solve(lp, o)) };
    });
    this._hp.catch(() => { this._hp = null; });
    return this._hp;
  }

  // backup: pure-JavaScript branch and bound (javascript-lp-solver)
  cargarJsSolver() {
    if (window.solver && window.solver.Solve) return Promise.resolve(window.solver);
    return this.cargarCodigo('assets/lpsolver.js', "window.solver || (typeof self !== 'undefined' && self.solver)").then((sv) => { window.solver = sv; return sv; });
  }

  modeloJs(reds, cands, kva, pmax) {
    const m = { optimize: 'coste', opType: 'min', constraints: { pmax: { max: pmax } }, variables: {}, ints: {}, options: { timeout: 4000 } };
    const C = m.constraints, V = m.variables;
    reds.forEach((r, i) => { C['need' + i] = { min: r.need }; C['don' + i] = { max: r.e }; V['r' + i] = { coste: r.reforzable ? 20000 : 1e7, ['need' + i]: r.need }; m.ints['r' + i] = 1; });
    cands.forEach((c, j) => {
      V['y' + j] = { coste: c.f, pmax: 1, ['cap' + j]: -0.85 * kva };
      m.ints['y' + j] = 1;
      C['cap' + j] = { max: 0 };
      c.links.forEach((L) => {
        const k = L.i + '_' + j;
        V['x' + k] = { coste: 59 * L.d / reds[L.i].need, ['need' + L.i]: 1, ['cap' + j]: 1, ['don' + L.i]: 1, ['lk' + k]: 1 };
        V['y' + j]['lk' + k] = -Math.min(reds[L.i].e, 0.85 * kva);
        C['lk' + k] = { max: 0 };
      });
    });
    return m;
  }

  resolver(D) {
    const lp = this.modeloLP(D.reds, D.cands, D.kva, 6);
    return this.cargarHighs()
      .then((H) => H.solve(lp, { time_limit: 10, output_flag: false }))
      .then((sol) => {
        const C = sol.Columns || {};
        return { motor: 'HiGHS', estado: sol.Status === 'Optimal' ? 'óptimo demostrado' : 'mejor encontrado (' + sol.Status + ')', valor: (n) => (C[n] ? C[n].Primal : 0), obj: sol.ObjectiveValue };
      })
      .catch((e1) => this.cargarJsSolver().then(() => {
        const sol = window.solver.Solve(this.modeloJs(D.reds, D.cands, D.kva, 6));
        if (!sol.feasible) throw new Error('sin solución');
        return { motor: 'el resolvedor JavaScript (HiGHS no disponible en este navegador)', estado: 'mejor encontrado (límite de 4 s)', valor: (n) => sol[n] || 0, obj: sol.result, error: e1 && e1.message };
      }));
  }

  datosPlan() {
    const { kva, dev } = this.state;
    const V = this.state.view, VH = V.w * 780 / 1400;
    const enV = (x, y) => x >= V.x && x <= V.x + V.w && y >= V.y && y <= V.y + VH;

    const g = {};
    cands.forEach((c) => { const k = c.links.map((l) => l.i).join(','); (g[k] = g[k] || []).push(c); });
    const coste = (c) => c.f + c.links.reduce((a, l) => a + 59 * l.d, 0);
    cands = [];
    Object.keys(g).forEach((k) => { g[k].sort((a, b) => coste(a) - coste(b)); cands.push.apply(cands, g[k].slice(0, 3)); });
    return { reds, cands, nCand, kva };
  }

  modeloLP(reds, cands, kva, pmax) {
    const t = (c, v) => '\n   ' + (c >= 0 ? '+ ' : '- ') + Math.abs(+c.toFixed(4)) + ' ' + v;
    const obj = [], cons = [], bin = [];
    reds.forEach((r, i) => { obj.push(t(r.reforzable ? 20000 : 1e7, 'r' + i)); bin.push('r' + i); });
    cands.forEach((c, j) => { obj.push(t(c.f, 'y' + j)); bin.push('y' + j); });
    const need = reds.map((r, i) => [t(r.need, 'r' + i)]), don = reds.map(() => []), cap = cands.map((c, j) => [t(-0.85 * kva, 'y' + j)]);
    cands.forEach((c, j) => c.links.forEach((L) => {
      const v = 'x' + L.i + '_' + j;
      obj.push(t(59 * L.d / reds[L.i].need, v));
      need[L.i].push(t(1, v)); don[L.i].push(t(1, v)); cap[j].push(t(1, v));
      cons.push(' lk' + L.i + '_' + j + ':' + t(1, v) + t(-Math.min(reds[L.i].e, 0.85 * kva), 'y' + j) + ' <= 0');
    }));
    need.forEach((a, i) => cons.push(' need' + i + ':' + a.join('') + ' >= ' + reds[i].need.toFixed(3)));
    don.forEach((a, i) => { if (a.length) cons.push(' don' + i + ':' + a.join('') + ' <= ' + reds[i].e.toFixed(3)); });
    cap.forEach((a, j) => cons.push(' cap' + j + ':' + a.join('') + ' <= 0'));
    if (cands.length) cons.push(' pmax:' + cands.map((c, j) => t(1, 'y' + j)).join('') + ' <= ' + pmax);
    return 'Minimize\n obj:' + obj.join('') + '\nSubject To\n' + cons.join('\n') + '\nBinary\n ' + bin.join('\n ') + '\nEnd\n';
  }

  interpretar(S, D) {
    const val = S.valor;
    const abiertos = [];
    D.cands.forEach((c, j) => { if (val('y' + j) > 0.5) abiertos.push(j); });
    const sites = abiertos.map((j) => ({ x: D.cands[j].x, y: D.cands[j].y }));
    const transfers = [];
    abiertos.forEach((j, k) => D.cands[j].links.forEach((L) => { const q = val('x' + L.i + '_' + j); if (q > 0.5) transfers.push({ id: D.reds[L.i].id, j: k, kva: q }); }));
    const refuerzos = [], sinResolver = [];
    D.reds.forEach((r, i) => { if (val('r' + i) > 0.5) (r.reforzable ? refuerzos : sinResolver).push(r.id); });
    return { sites, transfers, refuerzos, sinResolver };
  }

  sugerirHubEn() {
    const { kva, dev } = this.state;
    const V = this.state.view, VH = V.w * 780 / 1400;
    const s = this.simular(this.state.nuevos, kva, dev);
    const nodos = s.cts.map((c) => ({ id: c.id, x: c.x, y: c.y, cap: c.cap, load: c.load2 }))
      .concat(this.state.nuevos.map((n, i) => ({ id: 'N' + (i + 1) + ' nuevo', x: n.x, y: n.y, cap: kva, load: s.carga[i] })));
    const cx = V.x + V.w / 2, cy = V.y + VH / 2;
    const stp = Math.max(15, V.w / 45);
    let best = null;
    for (let x = V.x + stp / 2; x < V.x + V.w; x += stp) {
      for (let y = V.y + stp / 2; y < V.y + VH; y += stp) {
        if (x < 0 || y < 0 || x > MAPA.W || y > MAPA.H) continue;
        const k = this.zona(x, y).k;
        if (k === 'x' || k === 's') continue;
        nodos.forEach((n) => {
          const d = Math.hypot(n.x - x, n.y - y);
          if (d > 400) return;
          const uA = (n.load + 180) / n.cap;
          if (uA >= 0.9) return;
          const sc = 59 * d + 30000 * Math.max(0, uA - 0.55) + 12 * Math.hypot(x - cx, y - cy);
          if (!best || sc < best.sc) best = { x: Math.round(x), y: Math.round(y), sc, n, d, uA };
        });
      }
    }
    return best;
  }

  mapPoint(e) {
    const svg = document.getElementById('nc-mapa');
    if (!svg) return null;
    const r = svg.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return null;
    const v = this.state.view, h = v.w * 780 / 1400;
    return { x: v.x + (e.clientX - r.left) / r.width * v.w, y: v.y + (e.clientY - r.top) / r.height * h };
  }

  mover(e) {
    const d = this.state.drag;
    if (d == null) return;
    if (d === 'pan') {
      const ps = this._pan;
      const r = document.getElementById('nc-mapa').getBoundingClientRect();
      const k = ps.v.w / r.width;
      const dx = e.clientX - ps.cx, dy = e.clientY - ps.cy;
      if (Math.abs(dx) + Math.abs(dy) > 4) this._panMoved = true;
      this.setState({ view: this.vista({ x: ps.v.x - dx * k, y: ps.v.y - dy * k, w: ps.v.w }) });
      return;
    }
    const p = this.mapPoint(e);
    if (d === 'nuevo') {
      this.setState({ preview: p, ghost: p ? null : { x: e.clientX, y: e.clientY }, moved: true });
    } else if (d === 'hub') {
      this.setState({ hubPreview: p, ghost: p ? null : { x: e.clientX, y: e.clientY }, moved: true });
    } else if (typeof d === 'string' && d.indexOf('h:') === 0) {
      if (!p) return;
      const list = this.state.hubs.slice();
      list[+d.slice(2)] = p;
      this.setState({ hubs: list, moved: true });
    } else if (p) {
      const list = this.state.nuevos.slice();
      list[d] = p;
      this.setState({ nuevos: list, moved: true });
    }
  }

  fuera(p) { return p.x < 0 || p.y < 0 || p.x > MAPA.W || p.y > MAPA.H; }

  colocar(p, extra) {
    if (this.fuera(p)) { this.setState(Object.assign({ msg: 'Fuera de Bilbao el modelo no tiene red de baja tensión: coloca los centros dentro de la ciudad.' }, extra)); return; }
    if (this.zona(p.x, p.y).k === 'x') {
      this.setState(Object.assign({ msg: 'Ahí no se puede construir: elige un punto en una calle, una manzana o un parque.' }, extra));
      return;
    }
    this.setState(Object.assign({ nuevos: this.state.nuevos.concat([p]), msg: '' }, extra));
  }

  soltar(e) {
    const d = this.state.drag;
    if (d == null) return;
    if (d === 'pan') { this._justPanned = this._panMoved; this.setState({ drag: null }); return; }
    if (d === 'nuevo') {
      const p = this.mapPoint(e) || this.state.preview;
      if (p && this.state.moved) {
        this.colocar(p, { drag: null, preview: null, ghost: null, armed: false });
      } else {
        this.setState({ drag: null, preview: null, ghost: null, armed: true, msg: 'Ahora haz clic en el mapa donde quieras colocar el centro nuevo.' });
      }
    } else if (d === 'hub') {
      const p = this.mapPoint(e) || this.state.hubPreview;
      if (p && this.state.moved && this.fuera(p)) this.setState({ drag: null, hubPreview: null, ghost: null, armedHub: false, msg: 'Fuera de Bilbao el modelo no tiene red de baja tensión: coloca los hubs dentro de la ciudad.' });
      else if (p && this.state.moved) this.setState({ hubs: this.state.hubs.concat([p]), drag: null, hubPreview: null, ghost: null, armedHub: false, msg: '' });
      else this.setState({ drag: null, hubPreview: null, ghost: null, armedHub: true, armed: false, msg: 'Ahora haz clic en el mapa donde quieras poner el hub de recarga.' });
    } else {
      this.setState({ drag: null, moved: false });
    }
  }

  _temaAplicar(t, guardar) {
    if (t !== 'dark' && t !== 'light') return;
    this._tema = t;
    if (typeof document !== 'undefined') document.documentElement.setAttribute('data-nl-tema', t);
    if (guardar) { try { localStorage.setItem('nl-tema', t); } catch (e) {} }
    this.setState({ _tema: t });
  }

  _temaEmitir(msg) {
    if (typeof window === 'undefined') return;
    const visit = (w, depth) => {
      try { if (w !== window) w.postMessage(msg, '*'); } catch (e) {}
      if (depth > 4) return;
      let n = 0;
      try { n = w.frames.length; } catch (e) { n = 0; }
      for (let i = 0; i < n; i++) { try { visit(w.frames[i], depth + 1); } catch (e) {} }
    };
    try { visit(window.top, 0); } catch (e) {}
  }

  _temaInit() {
    if (this._ti) return;
    this._ti = true;
    let t = null;
    try { t = localStorage.getItem('nl-tema'); } catch (e) {}
    this._elegido = !!t;
    try { if (!t && typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; } catch (e) {}
    this._tema = t || 'light';
    if (typeof document !== 'undefined') document.documentElement.setAttribute('data-nl-tema', this._tema);
    if (typeof window === 'undefined' || !window.addEventListener) return;
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.nlTema && d.nlTema !== this._tema) { this._elegido = true; this._temaAplicar(d.nlTema, true); }
      if (d.nlTemaPedir && this._elegido && e.source) { try { e.source.postMessage({ nlTema: this._tema }, '*'); } catch (err) {} }
    });
    window.addEventListener('storage', (e) => { if (e.key === 'nl-tema' && e.newValue && e.newValue !== this._tema) this._temaAplicar(e.newValue, false); });
    setTimeout(() => this._temaEmitir({ nlTemaPedir: true }), 300);
  }

  renderVals() {
    this._temaInit();
    const oscuro = this._tema === 'dark';
    return Object.assign(this._rv(), {
      temaTxt: oscuro ? '☀ Modo claro' : '☾ Modo oscuro', temaOn: oscuro ? 'true' : 'false',
      toggleTema: () => {
        const t = oscuro ? 'light' : 'dark';
        this._elegido = true;
        this._temaAplicar(t, true);
        this._temaEmitir({ nlTema: t });
      }
    });
  }

  _rv() {

    const colOf = (u) => (u >= 0.9 ? '#B42318' : (u >= 0.7 ? '#E0A112' : '#2F8F46'));

      tip: letras[i] + ' · ' + this.zona(n.x, n.y).nombre + ' · ' + Math.round(sim.carga[i]) + ' kVA de ' + kva + ' · caben ' + caben(kva, sim.carga[i]) + ' cargadores · arrastra para moverlo',
      grab: (e) => { e.preventDefault(); e.stopPropagation(); this.setState({ drag: i, moved: false, armed: false, msg: '' }); }
    }));
    let tabla = [];

      return { id: c.id, calle: c.calle + (sc.ref ? ' · reforzado a ' + sc.cap + ' kVA' : ''), fw: sc.ref ? '600' : '400', a: Math.round(u1 * 100) + ' %', c1: txtOf(u1), d: Math.round(u2 * 100) + ' %', c2: txtOf(u2), k: u2 >= 0.9 ? '×' : String(caben(sc.cap, sc.load2)), _d: Math.abs(u1 - u2) + (sc.ref ? 1 : 0), _u: u2 };
    };
    base.forEach((c, i) => { if (Math.abs(c.load - sim.cts[i].load2) > 0.5 || sim.cts[i].ref) tabla.push(fila(c, i)); });
    if (!tabla.length) tabla = visIdx.map((i) => fila(base[i], i)).sort((a, b) => b._u - a._u);
    else tabla.sort((a, b) => b._d - a._d);
    tabla = tabla.slice(0, 12);
    nuevos.forEach((n, i) => tabla.push({ id: letras[i] + ' nuevo', calle: kva + ' kVA · ' + this.zona(n.x, n.y).nombre, fw: '600', a: '—', c1: 'var(--nl-muted)', d: Math.round(sim.carga[i] / kva * 100) + ' %', c2: txtOf(sim.carga[i] / kva), k: sim.carga[i] / kva >= 0.9 ? '×' : String(caben(kva, sim.carga[i])) }));
    const r = sim.rojos;
    const bv = visIdx.map((i) => base[i]), sv = visIdx.map((i) => sim.cts[i]);
    const nvIdx = nuevos.map((n, i) => i).filter((i) => enVista(nuevos[i].x, nuevos[i].y, 0));
    const capAntes = bv.reduce((a, c) => a + caben(c.cap, c.load), 0);
    const capDespues = sv.reduce((a, c) => a + caben(c.cap, c.load2), 0) + nvIdx.reduce((a, i) => a + caben(kva, sim.carga[i]), 0);
    const verdesAntes = bv.filter((c) => c.load / c.cap < 0.7).length;

    const rojVis = sv.filter((c) => c.load2 / c.cap >= 0.9).length;
    const zonaTxt = ' En la zona visible: ' + rojVis + ' en rojo de ' + sv.length + ' centros.';
    const nh = hubsAct.length;
    const hl = sim.hubLinks;
    const hRed = hl.filter((l) => l.cerca && l.tipo !== 'forzado' && l.tipo !== 'mt').length, hFor = hl.filter((l) => l.tipo === 'forzado').length, hMt = hl.filter((l) => l.tipo === 'mt').length;
    const hubRes = nh ? ' Hubs: ' + (nh - hFor - hMt) + ' con margen' + (hRed ? ' (' + (hRed === 1 ? '1 redirigido' : hRed + ' redirigidos') + ' a un centro más claro que el más cercano)' : '') + (hFor ? ', ' + hFor + ' sin margen cerca (' + (hFor === 1 ? 'satura su centro' : 'saturan su centro') + ')' : '') + (hMt ? ', ' + hMt + (hMt === 1 ? ' necesita' : ' necesitan') + ' centro nuevo o media tensión' : '') + '.' : '';

        : rojosAntes > rojosBase
        ? ['Los hubs de recarga saturan la red', 'Con ' + nh + (nh === 1 ? ' hub' : ' hubs') + ' (+' + sim.hubKva + ' kVA en punta) se pasa de ' + rojosBase + ' a ' + rojosAntes + ' centros en rojo. Coloca un centro nuevo cerca o pulsa Optimizar.', '#B42318', 'var(--nl-bad-bg)', 'var(--nl-bad-fg)']
        : ['Los hubs caben en la red', 'Con ' + nh + (nh === 1 ? ' hub' : ' hubs') + ' (+' + sim.hubKva + ' kVA en punta) no aparecen centros nuevos en rojo: se han conectado a centros con margen.', '#2F8F46', 'var(--nl-ok-bg)', 'var(--nl-ok-fg)'])
      : !nuevos.length ? ['Sin centros nuevos', rojosAntes + ' centros en rojo en toda la ciudad.' + zonaTxt + ' Arrastra un centro nuevo al mapa o pulsa Optimizar.', '#9AA8B6', 'var(--nl-soft)', '#13233A']
      : (r === 0 ? ['La ciudad queda sin centros en rojo', 'De ' + rojosAntes + ' centros saturados a ninguno.', '#2F8F46', 'var(--nl-ok-bg)', 'var(--nl-ok-fg)']
      : (r < rojosAntes ? [(r === 1 ? 'Mejora, pero queda 1 centro' : 'Mejora, pero quedan ' + r + ' centros') + ' en rojo', 'En toda la ciudad, de ' + rojosAntes + ' a ' + r + '.' + zonaTxt + ' Mueve el centro, añade otro u optimiza en otra zona.', '#E0A112', 'var(--nl-warn-bg)', 'var(--nl-warn-fg)']
      : ['Apenas cambia la saturación', (r === 1 ? 'Sigue 1 centro' : 'Siguen ' + r + ' centros') + ' en rojo en la ciudad: el centro nuevo no alcanza a los saturados.' + zonaTxt, '#B42318', 'var(--nl-bad-bg)', 'var(--nl-bad-fg)']));
    res[1] += hubRes;
    const costes = [];

    });
    sim.refuerzos.forEach((q) => costes.push({ label: 'Reforzar ' + q.id + ' (' + q.de + ' → ' + q.a + ' kVA)', valor: fmtE(20000) }));
    const plazo = sim.partidas.reduce((a, p) => (p.z.plazo > a.plazo ? p.z : a), { plazo: 0, plazoTxt: '—' }).plazoTxt;
    const seg = (cur, list, key) => list.map(([k, l]) => ({

      .concat(nuevos.map((n, i) => { const u = sim.carga[i] / kva; return { x: Math.round(n.x), y: Math.round(n.y), r: Math.round(110 * HK), col: colOf(u), op: '0.45' }; }));
    // substations: each CT belongs to the nearest one
    const subOf = (x, y) => { let b = null, bd = Infinity; MAPA.subs.forEach((q) => { const d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; b = q; } }); return b; };
    const cx = V.x + V.w / 2, cy = V.y + VH / 2;

    if (dev && nuevos.length && subOf(nuevos[0].x, nuevos[0].y) === st) stAdd += 160;
